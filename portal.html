            const imgFiles = [];
            for (const item of items) {
              const imgType = item.types.find(t => t.startsWith("image/"));
              if (imgType) imgFiles.push(await item.getType(imgType));
            }
            if (imgFiles.length) { await addImageFiles(imgFiles); return; }
          }
          if (navigator.clipboard && navigator.clipboard.readText) {
            const txt = (await navigator.clipboard.readText()).trim();
            if (txt) {
              if (/^https?:\/\/|^assets\//i.test(txt)) {
                vd.imagenes = (vd.imagenes || []).concat([txt]);
                render();
                return;
              }
              document.getElementById("v-img-url").value = txt;
              return;
            }
          }
          alert("No se encontró ninguna imagen ni enlace en el portapapeles.");
        } catch (err) {
          alert("Tu navegador bloqueó el acceso directo al portapapeles. Haz clic en el recuadro de imágenes y presiona Ctrl + V.");
        }
      };

      const imgBox = document.getElementById("v-img-box");
      if (imgBox) imgBox.addEventListener("paste", async (e) => {
        const items = e.clipboardData && e.clipboardData.items ? Array.from(e.clipboardData.items) : [];
        const imgFiles = items.filter(it => it.type && it.type.startsWith("image/")).map(it => it.getAsFile()).filter(Boolean);
        if (imgFiles.length) {
          e.preventDefault();
          await addImageFiles(imgFiles);
        }
      });
      app.querySelectorAll("[data-vimg-up]").forEach(b => b.onclick = () => {
        syncDraftFields();
        const i = +b.dataset.vimgUp;
        if (i > 0) { const arr = vd.imagenes.slice(); [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; vd.imagenes = arr; render(); }
      });
      app.querySelectorAll("[data-vimg-down]").forEach(b => b.onclick = () => {
        syncDraftFields();
        const i = +b.dataset.vimgDown;
        if (i < vd.imagenes.length - 1) { const arr = vd.imagenes.slice(); [arr[i+1], arr[i]] = [arr[i], arr[i+1]]; vd.imagenes = arr; render(); }
      });
      app.querySelectorAll("[data-vimg-del]").forEach(b => b.onclick = () => {
        syncDraftFields();
        const i = +b.dataset.vimgDel;
        vd.imagenes = vd.imagenes.filter((_, idx) => idx !== i);
        render();
      });
      const cancelBtn = document.getElementById("v-cancel-edit");
      if (cancelBtn) cancelBtn.onclick = () => { state.vitrinaDraft = null; render(); };
      const resetBtn = document.getElementById("v-reset");
      if (resetBtn) resetBtn.onclick = () => { state.vitrinaDraft = null; render(); };

      document.getElementById("vitrina-form").onsubmit = async (e) => {
        e.preventDefault();
        syncDraftFields();
        const st = document.getElementById("v-status");
        const btn = document.getElementById("v-save-btn");
        const row = {
          id: vd.id || newId("vit"),
          titulo: vd.titulo.trim(),
          distrito: vd.distrito.trim(),
          etiqueta: vd.etiqueta || "EXCLUSIVIDAD",
          precio: vd.precio.trim(),
          caracteristicas: vd.caracteristicas.trim(),
          descripcion: vd.descripcion.trim(),
          imagenes: vd.imagenes || [],
          usar_carrusel: !!vd.usar_carrusel,
          orden: vd.orden || 0,
          visible: vd.visible !== false,
          actualizado: new Date().toISOString()
        };
        if (state.mode === "local") {
          const list = state.vitrina.filter(x => x.id !== row.id).concat([row]).sort((a,b) => (a.orden||0) - (b.orden||0));
          localStorage.setItem("cw_vitrina_demo", JSON.stringify(list));
          state.vitrinaDraft = null;
          loadVitrina();
          return;
        }
        btn.disabled = true; st.textContent = "Guardando en vitrina…";
        const { error } = await state.sb.from("vitrina_propiedades").upsert(row);
        btn.disabled = false;
        if (error) { st.textContent = "Error: " + error.message; return; }
        state.vitrinaDraft = null;
        await loadVitrina();
      };

      const bindVitrinaRowActions = () => {
        const seedBtn = document.getElementById("v-seed-btn");
        if (seedBtn) seedBtn.onclick = async () => {
          seedBtn.disabled = true; seedBtn.textContent = "Importando…";
          const rows = DEFAULT_VITRINA.map(x => ({ ...x, actualizado: new Date().toISOString() }));
          const { error } = await state.sb.from("vitrina_propiedades").upsert(rows);
          if (error) { alert("Error al importar: " + error.message); seedBtn.disabled = false; seedBtn.textContent = "Importar las 3 propiedades actuales de la web"; return; }
          await loadVitrina();
        };
        app.querySelectorAll("[data-vtoggle]").forEach(b => b.onclick = async () => {
          const found = state.vitrina.find(x => x.id === b.dataset.vtoggle);
          if (!found) return;
          const nextVis = found.visible === false;
          if (state.mode === "local") {
            const list = state.vitrina.map(x => x.id === found.id ? { ...x, visible: nextVis } : x);
            localStorage.setItem("cw_vitrina_demo", JSON.stringify(list));
            loadVitrina();
            return;
          }
          const { error } = await state.sb.from("vitrina_propiedades").update({ visible: nextVis, actualizado: new Date().toISOString() }).eq("id", found.id);
          if (error) alert(error.message); else loadVitrina();
        });
        app.querySelectorAll("[data-vdup]").forEach(b => b.onclick = () => {
          const found = state.vitrina.find(x => x.id === b.dataset.vdup);
          if (found) {
            const copy = clone(found);
            copy.id = "";
            copy.titulo = (copy.titulo || "Propiedad") + " (copia)";
            copy.orden = state.vitrina.length + 1;
            state.vitrinaDraft = copy;
            render();
          }
        });
        app.querySelectorAll("[data-vedit]").forEach(b => b.onclick = () => {
          const found = state.vitrina.find(x => x.id === b.dataset.vedit);
          if (found) { state.vitrinaDraft = clone(found); render(); }
        });
        app.querySelectorAll("[data-vdel]").forEach(b => b.onclick = async () => {
          const found = state.vitrina.find(x => x.id === b.dataset.vdel);
          const ok = await cwConfirm({
            title: 'Eliminar de Vitrina Web',
            message: '¿Quitar "' + ((found && found.titulo) || "esta propiedad") + '" de la vitrina pública de la web?',
            confirmText: "Sí, eliminar"
          });
          if (!ok) return;
          if (state.mode === "local") {
            const list = state.vitrina.filter(x => x.id !== b.dataset.vdel);
            localStorage.setItem("cw_vitrina_demo", JSON.stringify(list));
            loadVitrina();
            return;
          }
          const { error } = await state.sb.from("vitrina_propiedades").delete().eq("id", b.dataset.vdel);
          if (error) alert(error.message); else loadVitrina();
        });
      };
      const updateVitrinaList = () => {
        const list = filterVitrina();
        const listEl = document.getElementById("vit-list");
        const countEl = document.getElementById("vit-count");
        if (listEl) listEl.innerHTML = renderVitrinaRows(list);
        if (countEl) countEl.textContent = "Mostrando " + list.length + " de " + state.vitrina.length + " propiedades";
        bindVitrinaRowActions();
      };
      bindVitrinaRowActions();
      document.getElementById("vit-q").addEventListener("input", (e) => { af.vitQ = e.target.value; updateVitrinaList(); });
      document.getElementById("vit-vis").onchange = (e) => { af.vitVis = e.target.value; updateVitrinaList(); };
      document.getElementById("vit-tag").onchange = (e) => { af.vitTag = e.target.value; updateVitrinaList(); };
      document.getElementById("vit-dist").onchange = (e) => { af.vitDist = e.target.value; updateVitrinaList(); };
      document.getElementById("vit-clear").onclick = () => {
        af.vitQ = ""; af.vitVis = "all"; af.vitTag = "all"; af.vitDist = "all";
        document.getElementById("vit-q").value = "";
        document.getElementById("vit-vis").value = "all";
        document.getElementById("vit-tag").value = "all";
        document.getElementById("vit-dist").value = "all";
        updateVitrinaList();
      };
      return;
    }

    setPageHeader("Accesos por inmueble", "Administración · Resumen y accesos");
    const totalVisits = state.props.reduce((s, p) => s + (p.visitas ? p.visitas.length : 0), 0);
    const pendingAccessCount = state.props.length - withAccessCount;
    const filterAccess = () => {
      const q = (af.accQ || "").trim().toLowerCase();
      let list = state.props.filter(p => {
        const hasMail = !!(p.propietarioEmail || "").trim();
        if (af.accStatus === "with" && !hasMail) return false;
        if (af.accStatus === "pending" && hasMail) return false;
        const stName = STAGES[p.etapa || 0] || STAGES[0];
        if (af.accStage !== "all" && stName !== af.accStage) return false;
        if (q) {
          const hay = ((p.propiedad || "") + " " + (p.propietario || "") + " " + (p.propietarioEmail || "") + " " + (p.direccion || "")).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      if (af.accSort === "pending") {
        list = list.slice().sort((a, b) => (!!(a.propietarioEmail || "").trim() ? 1 : 0) - (!!(b.propietarioEmail || "").trim() ? 1 : 0));
      } else if (af.accSort === "visits") {
        list = list.slice().sort((a, b) => ((b.visitas || []).length) - ((a.visitas || []).length));
      } else {
        list = list.slice().sort((a, b) => (a.propiedad || "").localeCompare(b.propiedad || "", "es"));
      }
      return list;
    };

    const renderAccessRows = (list) => {
      if (!state.props.length) return '<p class="muted" style="font-size:14px">Aún no hay propiedades creadas.</p>';
      if (!list.length) return '<p class="muted" style="font-size:14px">Ningún inmueble coincide con los filtros seleccionados.</p>';
      return list.map(p => {
        const hasMail = !!(p.propietarioEmail || "").trim();
        const stName = STAGES[p.etapa || 0] || STAGES[0];
        const vLen = (p.visitas || []).length;
        const dLen = (p.documentos || []).length;
        const isEditingRow = state.editingAccessId === p.id;
        return '<div class="admin-prop-row">' +
          '<span>' +
            '<b>' + esc(p.propiedad || "Propiedad sin nombre") + '</b> ' +
            '<span class="pill" style="font-size:11px;padding:2px 8px">' + esc(stName) + '</span><br>' +
            '<small class="muted">' + esc(p.propietario || "Sin propietario") + (p.direccion ? ' · ' + esc(p.direccion) : '') + ' · ' + vLen + (vLen === 1 ? ' visita' : ' visitas') + ' · ' + dLen + ' docs</small>' +
          '</span>' +
          '<div>' +
            (isEditingRow
              ? '<form class="acc-inline-edit" data-acc-form="' + esc(p.id) + '" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
                  '<input type="email" value="' + esc(p.propietarioEmail || "") + '" placeholder="correo@propietario.com" style="min-height:34px;padding:6px 10px;font-size:13px;min-width:190px;flex:1">' +
                  '<button type="submit" class="btn btn-primary" style="min-height:34px;padding:6px 10px;font-size:12px">Guardar</button>' +
                  '<button type="button" class="btn btn-ghost" data-acc-cancel="' + esc(p.id) + '" style="min-height:34px;padding:6px 10px;font-size:12px">Cancelar</button>' +
                '</form>'
              : (hasMail ? '<span>' + esc(p.propietarioEmail) + '</span>' : '<span class="muted">Sin correo asignado</span>')) +
          '</div>' +
          '<span class="pill ' + (hasMail ? 'ok' : 'warn') + '">' + (hasMail ? 'Con acceso' : 'Pendiente') + '</span>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
            (!isEditingRow ? '<button type="button" class="btn btn-ghost" data-acc-edit="' + esc(p.id) + '" style="padding:5px 10px;min-height:34px;font-size:12px">' + (hasMail ? 'Editar correo' : 'Asignar correo') + '</button>' : '') +
            '<button type="button" class="btn btn-ghost" data-acc-copy="' + esc(p.id) + '" style="padding:5px 10px;min-height:34px;font-size:12px">Copiar enlace</button>' +
          '</div>' +
        '</div>';
      }).join("");
    };
    const filteredAccess = filterAccess();

    app.innerHTML =
      '<div class="page-head"><div><p class="page-kicker">Administración</p><h1>Resumen y Accesos</h1></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button type="button" class="btn btn-ghost" id="acc-csv">Exportar CSV</button>' +
          '<button type="button" class="btn btn-primary" id="acc-go-crear">+ Crear usuario</button>' +
        '</div>' +
      '</div>' +
      '<div class="admin-kpis cols-4">' +
        '<div class="card admin-kpi"><div><b>' + state.props.length + '</b><span>Inmuebles totales</span></div><span class="stat-ico navy">' + ICONS.home + '</span></div>' +
        '<div class="card admin-kpi"><div><b>' + withAccessCount + '</b><span>Con acceso activo</span></div><span class="stat-ico green">' + ICONS.shield + '</span></div>' +
        '<div class="card admin-kpi"><div><b>' + pendingAccessCount + '</b><span>Pendientes de acceso</span></div><span class="stat-ico orange">' + ICONS.userPlus + '</span></div>' +
        '<div class="card admin-kpi"><div><b>' + totalVisits + '</b><span>Visitas acumuladas</span></div><span class="stat-ico navy">' + ICONS.visits + '</span></div>' +
      '</div>' +
      '<div class="card sec">' +
        '<h3>Accesos de propietarios por inmueble</h3>' +
        '<p class="hint">Asigna o actualiza el correo autorizado de cada propiedad, filtra por etapa o estado y copia el enlace directo del propietario.</p>' +
        '<div class="admin-toolbar">' +
          '<input id="acc-q" type="search" value="' + esc(af.accQ) + '" placeholder="Buscar inmueble, propietario, correo o zona…">' +
          '<select id="acc-status"><option value="all">Todos los estados</option><option value="with"' + (af.accStatus === "with" ? ' selected' : '') + '>Con acceso</option><option value="pending"' + (af.accStatus === "pending" ? ' selected' : '') + '>Pendiente</option></select>' +
          '<select id="acc-stage"><option value="all">Todas las etapas</option>' + STAGES.map(s => '<option value="' + esc(s) + '"' + (af.accStage === s ? ' selected' : '') + '>' + esc(s) + '</option>').join("") + '</select>' +
          '<select id="acc-sort"><option value="name"' + (af.accSort === "name" ? ' selected' : '') + '>Orden: Nombre (A-Z)</option><option value="pending"' + (af.accSort === "pending" ? ' selected' : '') + '>Pendientes primero</option><option value="visits"' + (af.accSort === "visits" ? ' selected' : '') + '>Más visitas</option></select>' +
          '<button type="button" class="btn btn-ghost" id="acc-clear" style="min-height:38px;padding:6px 12px;font-size:13px">Limpiar</button>' +
        '</div>' +
        '<div class="admin-toolbar-meta"><span id="acc-count">Mostrando ' + filteredAccess.length + ' de ' + state.props.length + ' inmuebles</span></div>' +
        '<div class="row-list" id="acc-list">' + renderAccessRows(filteredAccess) + '</div>' +
      '</div>';

    const bindAccessRowActions = () => {
      app.querySelectorAll("[data-acc-edit]").forEach(b => {
        b.onclick = () => { state.editingAccessId = b.dataset.accEdit; updateAccessList(); };
      });
      app.querySelectorAll("[data-acc-cancel]").forEach(b => {
        b.onclick = () => { state.editingAccessId = null; updateAccessList(); };
      });
      app.querySelectorAll("[data-acc-form]").forEach(form => {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const pid = form.dataset.accForm;
          const nextEmail = (form.querySelector("input").value || "").trim().toLowerCase();
          if (state.mode === "supabase" && state.sb) {
            const { error } = await state.sb.from("propiedades").update({ propietario_email: nextEmail }).eq("id", pid);
            if (error) { alert("Error al guardar correo: " + error.message); return; }
          }
          const target = state.props.find(x => x.id === pid);
          if (target) target.propietarioEmail = nextEmail;
          state.editingAccessId = null;
          render();
        };
      });
      app.querySelectorAll("[data-acc-copy]").forEach(b => {
        b.onclick = async () => {
          const url = location.origin + location.pathname + "#propietario-" + b.dataset.accCopy;
          try {
            await navigator.clipboard.writeText(url);
            const orig = b.textContent;
            b.textContent = "✓ Copiado";
            setTimeout(() => { b.textContent = orig; }, 1600);
          } catch (err) { alert("Enlace: " + url); }
        };
      });
    };
    const updateAccessList = () => {
      const list = filterAccess();
      const listEl = document.getElementById("acc-list");
      const countEl = document.getElementById("acc-count");
      if (listEl) listEl.innerHTML = renderAccessRows(list);
      if (countEl) countEl.textContent = "Mostrando " + list.length + " de " + state.props.length + " inmuebles";
      bindAccessRowActions();
    };
    bindAccessRowActions();
    document.getElementById("acc-q").addEventListener("input", (e) => { af.accQ = e.target.value; updateAccessList(); });
    document.getElementById("acc-status").onchange = (e) => { af.accStatus = e.target.value; updateAccessList(); };
    document.getElementById("acc-stage").onchange = (e) => { af.accStage = e.target.value; updateAccessList(); };
    document.getElementById("acc-sort").onchange = (e) => { af.accSort = e.target.value; updateAccessList(); };
    document.getElementById("acc-clear").onclick = () => {
      af.accQ = ""; af.accStatus = "all"; af.accStage = "all"; af.accSort = "name";
      document.getElementById("acc-q").value = "";
      document.getElementById("acc-status").value = "all";
      document.getElementById("acc-stage").value = "all";
      document.getElementById("acc-sort").value = "name";
      updateAccessList();
    };
    document.getElementById("acc-go-crear").onclick = () => { state.page = "admin-crear"; render(); };
    document.getElementById("acc-csv").onclick = () => {
      const rows = [["Inmueble","Propietario","Correo asignado","Estado","Etapa","Visitas","Documentos","Direccion"]];
      filterAccess().forEach(p => {
        rows.push([
          p.propiedad || "", p.propietario || "", p.propietarioEmail || "",
          (p.propietarioEmail || "").trim() ? "Con acceso" : "Pendiente",
          STAGES[p.etapa || 0] || STAGES[0],
          String((p.visitas || []).length), String((p.documentos || []).length), p.direccion || ""
        ]);
      });
      const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cw-accesos-inmuebles.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    };
  }

  function renderEditor(){
    const writable = !!state.isAdmin && state.canWrite !== false;
    if (!state.props.length){
      renderSidebar(null);
      setupChatWidget(null);
      setPageHeader("Propiedades", "Panel del asesor");
      app.innerHTML = '<div class="card empty"><h2>Aún no hay propiedades en el portal</h2><p class="muted">Crea la primera propiedad para que su propietario pueda seguir el avance de la venta.</p>' +
        (writable ? '<div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap"><button class="btn btn-primary" id="new-blank">Nueva propiedad</button><button class="btn btn-ghost" id="new-demo">Crear propiedad de ejemplo</button></div>' : '<p class="notice" style="margin-top:16px">Tu acceso es de solo lectura.</p>') + '</div>';
      const nb = document.getElementById("new-blank"); if (nb) nb.onclick = () => createProp(false);
      const nd = document.getElementById("new-demo"); if (nd) nd.onclick = () => createProp(true);
      return;
    }

    const current = state.props.find(p => p.id === state.selected) || state.props[0];
    state.selected = current.id;
    if (!state.draft || state.draft.id !== current.id) { state.draft = clone(current); state.dirty = false; }
    const d = state.draft;
    subscribeMessages(current.id);
    renderSidebar(current);
    setupChatWidget(null);

    const saveBarHTML =
      '<div class="save-bar card sec">' +
        (writable ? '<button class="btn btn-danger" type="button" id="del-prop-bar">Eliminar propiedad</button>' : '') +
        '<span class="status" id="status" style="margin-right:auto">' + esc(state.dirty ? "Tienes cambios sin guardar." : state.status) + '</span>' +
        (writable ? '<button class="btn btn-primary" id="save" ' + (state.dirty ? "" : "disabled") + '>Guardar cambios</button>' : '') +
      '</div>';

    const readonlyNotice = writable ? '' : '<p class="notice" style="margin-bottom:16px">Tu acceso es de solo lectura: puedes revisar la información, pero no modificarla.</p>';
    const demoNotice = state.mode === "local" ? '<p class="notice" style="margin-bottom:16px">Modo demostración: los datos se guardan solo en este navegador.</p>' : '';
    const propTitle = esc(d.propiedad || "Propiedad sin nombre");
    const stageIdx = d.etapa || 0;
    const pct = Math.round(((stageIdx + 1) / STAGES.length) * 100);
    const visitasArr = d.visitas || [];
    const docsArr = d.documentos || [];
    const validDocs = docsArr.filter(x => safeUrl(x.url));

    if (state.page === "asesor-lista") {
      setPageHeader("Propiedades", state.props.length + " inmuebles registrados");
      const totalVisitsAll = state.props.reduce((s,p) => s + (p.visitas||[]).length, 0);
      const activeSales = state.props.filter(p => (p.etapa||0) >= 2 && (p.etapa||0) <= 3).length;
      const closingSales = state.props.filter(p => (p.etapa||0) >= 4).length;

      app.innerHTML = demoNotice +
        '<div class="page-head"><div><p class="page-kicker">Cartera de inmuebles</p><h1>Propiedades (' + state.props.length + ')</h1></div>' +
          (writable ? '<button class="btn btn-primary" id="new-blank-top">+ Nueva propiedad</button>' : '') +
        '</div>' +
        '<div class="stats stats-4">' +
          '<div class="card stat"><div><div class="n">' + state.props.length + '</div><div class="l">Inmuebles totales</div></div><div class="stat-ico navy">' + ICONS.home + '</div></div>' +
          '<div class="card stat"><div><div class="n">' + activeSales + '</div><div class="l">En publicación / visitas</div></div><div class="stat-ico orange">' + ICONS.visits + '</div></div>' +
          '<div class="card stat"><div><div class="n">' + closingSales + '</div><div class="l">En negociación / cierre</div></div><div class="stat-ico green">' + ICONS.shield + '</div></div>' +
          '<div class="card stat"><div><div class="n">' + totalVisitsAll + '</div><div class="l">Visitas acumuladas</div></div><div class="stat-ico navy">' + ICONS.users + '</div></div>' +
        '</div>' +
        '<div class="card sec" style="padding:16px 20px;margin-bottom:18px">' +
          '<div class="toolbar-row" style="margin-bottom:0">' +
            '<input id="prop-grid-search" type="search" placeholder="Buscar por propiedad, propietario, correo o zona…">' +
            '<select id="prop-stage-filter" style="max-width:220px"><option value="">Todas las etapas</option>' +
              STAGES.map((s,i) => '<option value="' + i + '">' + (i+1) + '. ' + s + '</option>').join("") +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="prop-grid" id="prop-grid">' +
          state.props.map(p => {
            const pStage = p.etapa || 0;
            const pPct = Math.round(((pStage + 1) / STAGES.length) * 100);

            '<div><label for="f-pemail">Correo del propietario (acceso al portal)</label><input id="f-pemail" type="email" data-field="propietarioEmail" value="' + esc(d.propietarioEmail) + '" placeholder="cliente@correo.com" maxlength="120"></div></div>' +
            '<div class="grid3" style="margin-top:14px"><div><label for="f-inm">Propiedad</label><input id="f-inm" data-field="propiedad" value="' + esc(d.propiedad) + '" maxlength="100"></div>' +
            '<div><label for="f-dir">Dirección o zona</label><input id="f-dir" data-field="direccion" value="' + esc(d.direccion) + '" maxlength="120"></div>' +
            '<div><label for="f-wsp">WhatsApp del asesor</label><input id="f-wsp" type="tel" data-field="asesorWhatsapp" value="' + esc(d.asesorWhatsapp) + '" placeholder="Ej. +51 910 818 357" maxlength="25"></div></div>' +
          '</div>' +
          '<div class="card sec"><h3>Indicadores comerciales</h3><p class="hint">Las visitas realizadas se cuentan automáticamente desde la pestaña Visitas.</p>' +
            '<div class="grid3"><div><label>Visitas realizadas</label><input value="' + visitasArr.length + '" disabled></div>' +
            '<div><label for="f-int">Interesados activos</label><input id="f-int" type="number" min="0" max="999" data-field="interesados" data-num="1" value="' + (d.interesados||0) + '"></div>' +
            '<div><label for="f-pro">Propuestas recibidas</label><input id="f-pro" type="number" min="0" max="999" data-field="propuestas" data-num="1" value="' + (d.propuestas||0) + '"></div></div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="card sec"><h3>Resumen semanal</h3><p class="hint">Cuenta en pocas líneas qué pasó esta semana con la venta.</p>' +
            '<div style="max-width:220px;margin-bottom:12px"><label for="f-rf">Semana del</label><input id="f-rf" type="date" data-field="resumenFecha" value="' + esc(d.resumenFecha) + '"></div>' +
            '<label for="f-res">Mensaje para el propietario</label><textarea id="f-res" data-field="resumen" style="min-height:140px" maxlength="1500">' + esc(d.resumen) + '</textarea>' +
          '</div>' +
          '<div class="card sec"><h3>Checklist del portal</h3><p class="hint">Estado de configuración de este inmueble.</p>' +
            '<div class="checklist">' +
              '<div class="check-item"><span>Correo del propietario</span><span class="pill ' + (hasEmail ? 'ok' : 'accent') + '">' + (hasEmail ? 'Configurado' : 'Pendiente') + '</span></div>' +
              '<div class="check-item"><span>WhatsApp del asesor</span><span class="pill ' + (hasWsp ? 'ok' : 'accent') + '">' + (hasWsp ? 'Configurado' : 'Pendiente') + '</span></div>' +
              '<div class="check-item"><span>Resumen semanal</span><span class="pill ' + (hasSummary ? 'ok' : 'accent') + '">' + (hasSummary ? 'Publicado' : 'Vacío') + '</span></div>' +
              '<div class="check-item"><span>Documentos compartidos</span><span class="pill">' + validDocs.length + '</span></div>' +
              '<div class="check-item"><span>Visitas registradas</span><span class="pill">' + visitasArr.length + '</span></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '</fieldset>' + saveBarHTML;

    document.getElementById("qa-msgs").onclick = () => { state.page = "asesor-mensajes"; render(); };
    document.getElementById("qa-visits").onclick = () => { state.page = "asesor-visitas"; render(); };
    document.getElementById("qa-link").onclick = () => { state.page = "asesor-link"; render(); };

    app.querySelectorAll("[data-field]").forEach(inp => inp.addEventListener("input", () => {
      d[inp.dataset.field] = inp.dataset.num ? Math.max(0, parseInt(inp.value||"0",10)||0) : inp.value; markDirty();
      if (inp.dataset.field === "propiedad") {
        const h1 = app.querySelector(".hello h1");
        if (h1) h1.textContent = inp.value || "Propiedad sin nombre";
      }
    }));
    app.querySelectorAll("button.step").forEach(b => b.onclick = () => { d.etapa = +b.dataset.stage; markDirty(); render(); });
    const sv = document.getElementById("save"); if (sv) sv.onclick = saveDraft; const dpb = document.getElementById("del-prop-bar"); if (dpb) dpb.onclick = () => deleteProp(current.id);
  }
  function markDirty(){ state.dirty = true; state.status = ""; renderStatus(); const sv = document.getElementById("save"); if (sv) sv.disabled = false; }
  function renderStatus(){ const s = document.getElementById("status"); if (s) s.textContent = state.dirty ? "Tienes cambios sin guardar." : state.status; }

  function renderClient(){
    const id = state.clientId || state.selected || (state.props[0] && state.props[0].id);
    const p = state.props.find(x => x.id === id) || state.props[0];
    if (!p){
      renderSidebar(null);
      setupChatWidget(null);
      setPageHeader("Portal del propietario", "Sin propiedad vinculada");
      const emailTxt = (state.user && state.user.email) ? ' (' + esc(state.user.email) + ')' : '';
      app.innerHTML = '<div class="card empty"><h2>Aún no tienes una propiedad vinculada</h2><p class="muted">No encontramos propiedades asociadas a tu cuenta' + emailTxt + '. Pide a tu asesor de CW que vincule tu correo a tu propiedad.</p>' +
        (state.mode === "supabase" ? '<p style="margin-top:18px"><button class="btn btn-ghost" id="client-logout">Cerrar sesión</button></p>' : '') + '</div>';
      const clo = document.getElementById("client-logout");
      if (clo) clo.onclick = () => state.sb.auth.signOut();
      return;
    }

    subscribeMessages(p.id);
    renderSidebar(p);
    setupChatWidget(p, "propietario");

    const stage = p.etapa || 0;
    const pct = Math.round(((stage + 1) / STAGES.length) * 100);
    const visitas = (p.visitas||[]).slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    const totalAsistentes = visitas.reduce((acc, v) => acc + (parseInt(v.personas, 10) || 0), 0);
    const docs = (p.documentos||[]).filter(x => safeUrl(x.url));
    const propTitle = esc(p.propiedad || "Tu propiedad");
    const rawWsp = (p.asesorWhatsapp || "51910818357").replace(/\D/g, "");
    const phone = rawWsp.length === 9 ? "51" + rawWsp : (rawWsp || "51910818357");
    const wspText = encodeURIComponent("Hola, soy " + (p.propietario || "propietario") + " (" + (p.propiedad || "mi propiedad") + ") y te escribo desde mi Portal CW.");
    const wspUrl = "https://wa.me/" + phone + "?text=" + wspText;

    if (state.page === "client-visitas") {
      setPageHeader("Visitas", propTitle);
      app.innerHTML =
        '<div class="page-head"><div><p class="page-kicker">' + propTitle + '</p><h1>Historial de visitas</h1></div>' +
          '<button type="button" class="btn btn-ghost" id="go-resumen-v">← Volver al resumen</button></div>' +
        '<div class="stats">' +
          '<div class="card stat"><div><div class="n">' + visitas.length + '</div><div class="l">Visitas realizadas</div></div><span class="stat-ico orange">' + ICONS.visits + '</span></div>' +
          '<div class="card stat"><div><div class="n">' + totalAsistentes + '</div><div class="l">Personas que visitaron</div></div><span class="stat-ico navy">' + ICONS.users + '</span></div>' +
          '<div class="card stat"><div><div class="n" style="font-size:20px">' + (visitas[0] ? fmtDate(visitas[0].fecha) : "—") + '</div><div class="l">Última visita registrada</div></div><span class="stat-ico green">' + ICONS.shield + '</span></div>' +
        '</div>' +
        '<div class="card sec">' +
          '<div class="toolbar-row"><h3 style="margin:0">Detalle de recorridos (' + visitas.length + ')</h3>' +
            '<input id="visit-filter" type="search" placeholder="Filtrar por comentario o fecha…" aria-label="Filtrar visitas"></div>' +
          '<div id="visit-list">' +
          (visitas.length
            ? visitas.map((v, i) => '<div class="visit" data-vsearch="' + esc((fmtDate(v.fecha) + " " + (v.feedback || "")).toLowerCase()) + '">' +
                '<span class="visit-num">#' + (visitas.length - i) + '</span>' +
                '<span class="visit-date">' + fmtDate(v.fecha) + '</span>' +
                '<span class="pill">' + (v.personas||0) + (v.personas==1?" persona":" personas") + '</span>' +
                '<span>' + esc(v.feedback || "Sin comentarios") + '</span>' +
                '<span class="pill ok">Realizada</span></div>').join("")
            : '<p class="muted">Todavía no hay visitas registradas. Te avisaremos apenas se agende la primera.</p>') +
          '</div>' +
        '</div>' +
        '<p class="footer">CW Inmobiliaria · Última actualización: ' + fmtDT(p.actualizado) + '</p>';
      document.getElementById("go-resumen-v").onclick = () => { state.page = "client-resumen"; render(); };
      const vf = document.getElementById("visit-filter");
      if (vf) vf.addEventListener("input", () => {
        const q = vf.value.trim().toLowerCase();
        app.querySelectorAll("#visit-list .visit").forEach(row => {
          row.style.display = (!q || (row.dataset.vsearch || "").includes(q)) ? "" : "none";
        });
      });
      return;
    }

    if (state.page === "client-docs") {
      setPageHeader("Documentos", propTitle);
      const getHost = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch(_){ return "Enlace externo"; } };
      app.innerHTML =
        '<div class="page-head"><div><p class="page-kicker">' + propTitle + '</p><h1>Documentos de tu propiedad</h1></div>' +
          '<button type="button" class="btn btn-ghost" id="go-resumen-d">← Volver al resumen</button></div>' +
        '<div class="stats stats-2">' +
          '<div class="card stat"><div><div class="n">' + docs.length + '</div><div class="l">Documentos compartidos</div></div><span class="stat-ico orange">' + ICONS.docs + '</span></div>' +
          '<div class="card stat"><div><div class="n" style="font-size:20px">Acceso seguro</div><div class="l">Enlaces verificados por tu asesor CW</div></div><span class="stat-ico green">' + ICONS.shield + '</span></div>' +
        '</div>' +
        '<div class="card sec">' +
          '<div class="toolbar-row"><h3 style="margin:0">Archivos disponibles</h3>' +
            '<input id="doc-filter" type="search" placeholder="Buscar documento…" aria-label="Buscar documento"></div>' +
          (docs.length
            ? '<div class="doc-grid" id="doc-grid">' + docs.map(x =>
                '<div class="doc-card" data-dsearch="' + esc((x.nombre || "").toLowerCase()) + '">' +
                  '<div class="doc-card-top"><span class="doc-card-ico">' + docIco + '</span><div><b>' + esc(x.nombre) + '</b><small>' + esc(getHost(x.url)) + '</small></div></div>' +
                  '<a class="btn btn-ghost" href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer" style="width:100%">Abrir documento ↗</a>' +
                '</div>'
              ).join("") + '</div>'
            : '<p class="muted">Tu asesor compartirá aquí tus documentos (Partida registral, contrato, estudio de mercado) cuando estén listos.</p>') +
        '</div>' +
        '<div class="card sec" style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">' +
          '<div><h3>¿Necesitas otro documento?</h3><p class="muted" style="font-size:13.5px;margin:0">Solicítalo directamente a tu asesor por chat o WhatsApp.</p></div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-primary" id="open-chat-docs">Escribir en chat</button><a class="btn wsp-btn" style="width:auto" href="' + wspUrl + '" target="_blank" rel="noopener">WhatsApp</a></div>' +
        '</div>' +
        '<p class="footer">CW Inmobiliaria · Última actualización: ' + fmtDT(p.actualizado) + '</p>';
      document.getElementById("go-resumen-d").onclick = () => { state.page = "client-resumen"; render(); };
      document.getElementById("open-chat-docs").onclick = () => setChatOpen(true);
      const df = document.getElementById("doc-filter");
      if (df) df.addEventListener("input", () => {
        const q = df.value.trim().toLowerCase();
        app.querySelectorAll("#doc-grid .doc-card").forEach(c => {
          c.style.display = (!q || (c.dataset.dsearch || "").includes(q)) ? "" : "none";
        });
      });
      return;
    }

    setPageHeader("Resumen general", propTitle);
    app.innerHTML =
      '<div class="card hello">' +
        '<div><p class="hello-kicker">Seguimiento en tiempo real</p><h1>Hola, ' + esc(p.propietario || "propietario") + '</h1><p>Aquí puedes revisar el avance de la venta de tu propiedad.</p>' +
          '<div class="progress-pill"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div><span>' + pct + '% del proceso · Etapa ' + (stage+1) + ' de ' + STAGES.length + '</span></div></div>' +
        '<div class="prop-badge"><span class="ico">' + houseIco + '</span><div><b>' + propTitle + '</b><span>' + esc(p.direccion || "Lima, Perú") + '</span></div></div>' +
      '</div>' +
      '<div class="card sec"><h3>Estado de tu venta <span class="pill accent">Etapa ' + (stage+1) + ' de ' + STAGES.length + ' · ' + STAGES[stage] + '</span></h3>' +
        stepperHTML(stage, false) +
        '<div class="stage-desc"><span><b>En esta etapa:</b> ' + STAGE_INFO[stage] + '</span><span class="pill">Siguiente: ' + (STAGES[stage+1] || "Venta cerrada") + '</span></div>' +
      '</div>' +
      '<div class="stats stats-4">' +
        '<div class="card stat"><div><div class="n">' + visitas.length + '</div><div class="l">Visitas realizadas</div></div><span class="stat-ico orange">' + ICONS.visits + '</span></div>' +
        '<div class="card stat"><div><div class="n">' + totalAsistentes + '</div><div class="l">Personas que visitaron</div></div><span class="stat-ico navy">' + ICONS.users + '</span></div>' +
        '<div class="card stat"><div><div class="n">' + (p.interesados||0) + '</div><div class="l">Interesados activos</div></div><span class="stat-ico orange">' + ICONS.shield + '</span></div>' +
        '<div class="card stat"><div><div class="n">' + (p.propuestas||0) + '</div><div class="l">Propuestas recibidas</div></div><span class="stat-ico green">' + ICONS.docs + '</span></div>' +
      '</div>' +
      '<div class="client-split">' +
        '<div>' +
          '<div class="card sec summary"><h3>Resumen semanal <span class="date">' + (p.resumenFecha ? "Semana del " + fmtDate(p.resumenFecha) : "") + '</span></h3><p>' + esc(p.resumen || "Tu asesor publicará aquí el resumen de la semana.") + '</p></div>' +
          '<div class="card sec"><h3 style="display:flex;justify-content:space-between;align-items:center">Última visita registrada <button type="button" class="btn btn-ghost" id="btn-see-visits" style="min-height:34px;padding:6px 12px;font-size:12.5px">Ver todas (' + visitas.length + ') →</button></h3>' +
            (visitas[0]
              ? '<div class="visit" style="border:0;padding-bottom:0"><span class="visit-num">#' + visitas.length + '</span><span class="visit-date">' + fmtDate(visitas[0].fecha) + '</span><span class="pill">' + (visitas[0].personas||0) + (visitas[0].personas==1?" persona":" personas") + '</span><span>' + esc(visitas[0].feedback || "Sin comentarios") + '</span><span></span></div>'
              : '<p class="muted" style="font-size:13.5px">Aún no hay visitas registradas. Te avisaremos apenas se agende la primera.</p>') +
          '</div>' +
        '</div>' +
        '<div class="card sec advisor-card">' +
          '<div class="advisor-head"><span class="advisor-ava">CW</span><div><h3 style="margin:0">Tu asesor CW</h3><span class="muted" style="font-size:13px">Atención personalizada · Lima</span></div></div>' +
          '<p class="muted" style="font-size:13.5px;margin:0">¿Tienes dudas sobre una visita, propuesta o documento? Escríbenos directo.</p>' +
          '<div class="advisor-actions"><button type="button" class="btn btn-primary" id="btn-open-chat">Abrir chat</button><a class="btn wsp-btn" href="' + wspUrl + '" target="_blank" rel="noopener">WhatsApp</a></div>' +
          '<button type="button" class="btn btn-ghost" id="btn-see-docs" style="width:100%">Ver documentos compartidos (' + docs.length + ') →</button>' +
        '</div>' +
      '</div>' +
      '<p class="footer">CW Inmobiliaria · Tu propiedad, nuestro compromiso · Última actualización: ' + fmtDT(p.actualizado) + '</p>';

    document.getElementById("btn-see-visits").onclick = () => { state.page = "client-visitas"; render(); };
    document.getElementById("btn-see-docs").onclick = () => { state.page = "client-docs"; render(); };
    document.getElementById("btn-open-chat").onclick = () => setChatOpen(true);
  }

  function messagesMarkup(ownerView){
    if (!state.messages.length) {
      return '<p class="muted" style="font-size:13.5px;text-align:center;margin:auto">' + (ownerView ? "¿Tienes alguna duda? Escríbele a tu asesor." : "Aún no hay mensajes con este propietario. Cuando te escriba desde su portal aparecerá aquí.") + '</p>';
    }
    return state.messages.map(m => '<div class="msg ' + (m.de === "asesor" ? "asesor" : "propietario") + '"><b>' + (m.de === "asesor" ? "Asesor CW" : "Propietario") + '</b>' + esc(m.texto) + '<small>' + fmtDT(m.fecha) + '</small></div>').join("");
  }

  function renderChatOnly(){
    const sbBadge = document.getElementById("sb-msg-badge");
    if (sbBadge) sbBadge.textContent = String(state.messages.length);

    const countEl = document.getElementById("chat-count");
    if (countEl) {
      if (state.chatOpen) {
        markChatSeen(state.msgFor);
        countEl.style.display = "none";
      } else {
        const seenAt = getChatSeen(state.msgFor);
        const unread = state.messages.filter(m => m.de === "asesor" && (!seenAt || (m.fecha || "") > seenAt)).length;
        if (unread > 0) {
          countEl.style.display = "grid";
          countEl.textContent = String(unread);
        } else {
          countEl.style.display = "none";
        }
      }
    }
    const ownerView = state.view === "cliente";
    const markup = messagesMarkup(ownerView);
    const box = document.getElementById("chat");
    if (box) {
      box.innerHTML = markup;
      box.scrollTop = box.scrollHeight;
    }
    const inbox = document.getElementById("chat-inbox");
    if (inbox) {
      inbox.innerHTML = markup;
      inbox.scrollTop = inbox.scrollHeight;
    }
    const inboxCnt = document.getElementById("inbox-msg-count");
    if (inboxCnt) inboxCnt.textContent = state.messages.length + (state.messages.length === 1 ? " mensaje" : " mensajes");
  }

  init();
})();
</script>
</body>
</html>
