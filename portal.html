<title>Portal del propietario · CW Inmobiliaria</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png">
<meta name="theme-color" content="#111B2E">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cw-azul:#111B2E; --cw-azul-2:#1A2740;
  --cw-naranja:#D96A2B; --cw-naranja-osc:#B85221; --cw-naranja-sua:#F0B384;
  --cw-crema:#FBF9F5; --cw-crema-2:#F2ECDF; --cw-gris:#576174;
  --bg:var(--cw-crema); --surface:#FFFFFF; --surface-2:#FAF7F2; --line:rgba(17,27,46,.10);
  --text:var(--cw-azul); --muted:var(--cw-gris); --navy:var(--cw-azul); --navy-2:var(--cw-azul-2);
  --orange:var(--cw-naranja); --orange-soft:#FCE9DD; --green:#237A4B; --green-soft:#E3F3EA;
  --shadow-sm:0 2px 10px rgba(17,27,46,.04);
  --shadow:0 10px 30px rgba(17,27,46,.07);
  --shadow-lg:0 20px 50px rgba(17,27,46,.14);
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; overflow-x:hidden; max-width:100%; }
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
body{ overflow-x:hidden; max-width:100%; }
body{ font-family:var(--sans); background:var(--bg); color:var(--text); font-size:15px; line-height:1.55; min-height:100%; -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--orange); outline-offset:2px; border-radius:8px; }

/* ===== App Shell (Sidebar + Topbar + Content) ===== */
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:40; background:#FFFFFF; }
.shell{ display:flex; min-height:100vh; }
body.is-auth-screen .shell{ display:block; }
body.is-auth-screen .sidebar,
body.is-auth-screen .topbar-app,
body.is-auth-screen .chat-widget{ display:none !important; }
body.is-auth-screen .main-area{ width:100%; min-width:0; }
body.is-auth-screen .wrap{ max-width:none; padding:0; }

/* Sidebar izquierdo */
.sidebar{ width:264px; flex:none; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:env(safe-area-inset-top,0px); height:calc(100vh - env(safe-area-inset-top,0px)); z-index:45; transition:width .22s ease, transform .24s ease; }
.sb-brand{ padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:11px; min-height:70px; }
.sb-brand img{ height:36px; width:auto; display:block; flex:none; }
.sb-brand-txt{ min-width:0; flex:1; }
.sb-brand-txt b{ display:block; font-size:13.5px; font-weight:800; letter-spacing:.03em; color:var(--navy); line-height:1.2; white-space:nowrap; overflow:hidden; }
.sb-brand-txt small{ display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; }
.sb-collapse-btn{ border:1px solid var(--line); background:var(--surface-2); color:var(--navy); width:30px; height:30px; border-radius:8px; display:grid; place-items:center; flex:none; transition:background .15s, transform .2s; }
.sb-collapse-btn:hover{ background:var(--cw-crema-2); }
.sb-close{ display:none; margin-left:auto; border:0; background:var(--surface-2); color:var(--navy); width:32px; height:32px; border-radius:8px; font-size:18px; line-height:1; }

.sb-prop-picker{ padding:14px 16px 6px; }
.sb-prop-picker label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px; }
.sb-prop-picker select{ min-height:38px; font-size:13px; font-weight:600; background:var(--surface-2); padding:7px 10px; }

.sb-nav{ flex:1; overflow-y:auto; padding:12px 10px; display:flex; flex-direction:column; gap:4px; }
.sb-group{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding:10px 12px 4px; white-space:nowrap; overflow:hidden; }
.sb-link{ width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; border:0; background:transparent; color:var(--text); font-size:13.5px; font-weight:600; text-align:left; text-decoration:none; transition:background .15s, color .15s; white-space:nowrap; }
.sb-link svg{ flex:none; opacity:.75; }
.sb-link:hover{ background:var(--surface-2); color:var(--navy); }
.sb-link[aria-current="page"]{ background:var(--orange-soft); color:var(--cw-naranja-osc); font-weight:700; }
.sb-link[aria-current="page"] svg{ opacity:1; color:var(--orange); }
.sb-badge{ margin-left:auto; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
.sb-link[aria-current="page"] .sb-badge{ background:#fff; color:var(--cw-naranja-osc); }

.sb-foot{ padding:12px; border-top:1px solid var(--line); display:grid; gap:8px; }
.sb-foot .btn{ width:100%; padding:10px 12px; }
.sb-backdrop{ display:none; position:fixed; inset:0; background:rgba(17,27,46,.45); z-index:42; backdrop-filter:blur(2px); }
.sb-backdrop.open{ display:block; }

/* Estado comprimido (solo iconos en desktop) */
@media (min-width:961px){
  body.sb-collapsed .sidebar{ width:76px; }
  body.sb-collapsed .sb-brand{ padding:14px 10px; flex-direction:column; gap:8px; }
  body.sb-collapsed .sb-brand-txt,
  body.sb-collapsed .sb-group,
  body.sb-collapsed .sb-prop-picker,
  body.sb-collapsed .sb-link span,
  body.sb-collapsed .sb-badge,
  body.sb-collapsed .sb-foot .sb-btn-lbl{ display:none !important; }
  body.sb-collapsed .sb-collapse-btn svg{ transform:rotate(180deg); }
  body.sb-collapsed .sb-link{ justify-content:center; padding:11px; }
  body.sb-collapsed .sb-foot .btn{ padding:10px; justify-content:center; }
}

/* Main area + Topbar limpia sin logo + Ancho completo */
.main-area{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar-app{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; height:64px; background:rgba(251,249,245,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding:0 clamp(16px,2.2vw,30px); display:flex; align-items:center; gap:14px; }
.menu-toggle{ display:none; border:1px solid var(--line); background:#fff; color:var(--navy); width:40px; height:40px; border-radius:10px; place-items:center; flex:none; }
.page-head-title{ margin-right:auto; min-width:0; }
.page-head-title h2{ font-size:16px; font-weight:800; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.page-head-title span{ display:block; font-size:12px; color:var(--muted); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wrap{ width:100%; max-width:none; padding:clamp(18px,2.2vw,26px) clamp(16px,2.5vw,32px) 64px; }

/* user profile menu */
.user-menu{ position:relative; flex:none; }
.user-btn{ display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px 12px 4px 4px; text-align:left; transition:border-color .2s, box-shadow .2s; }
.user-btn:hover{ border-color:rgba(17,27,46,.22); box-shadow:var(--shadow-sm); }
.avatar{ width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:800; font-size:12px; letter-spacing:.03em; flex:none; }
.user-meta{ line-height:1.2; }
.user-meta b{ display:block; font-size:13px; color:var(--navy); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-meta small{ display:block; font-size:11px; color:var(--muted); font-weight:600; }
.user-chev{ color:var(--muted); transition:transform .2s; flex:none; }
.user-menu.open .user-chev{ transform:rotate(180deg); }
.user-drop{ display:none; position:absolute; right:0; top:calc(100% + 8px); min-width:245px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lg); padding:8px; z-index:60; }
.user-menu.open .user-drop{ display:block; }
.user-drop-head{ padding:10px 12px; border-bottom:1px solid var(--line); margin-bottom:6px; }
.user-drop-head b{ display:block; font-size:14px; color:var(--navy); word-break:break-word; }
.user-drop-head span{ display:block; font-size:12px; color:var(--muted); margin-top:2px; }
.drop-item{ width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:0; background:transparent; font-size:13.5px; font-weight:600; color:var(--text); text-decoration:none; text-align:left; transition:background .15s; }
.drop-item:hover{ background:var(--surface-2); }
.drop-item.danger{ color:#C2412D; }
.drop-item.danger:hover{ background:#FCE8E5; }

/* split login 50/50 */
.auth-split{ display:grid; grid-template-columns:1fr 1fr; min-height:100vh; }
.auth-photo{ position:relative; overflow:hidden; background:var(--cw-azul); min-height:360px; }
.auth-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.auth-photo::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(17,27,46,.32) 0%, rgba(17,27,46,.88) 100%); }
.auth-caption{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(24px,4vw,48px); color:#fff; }
.auth-photo-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.auth-photo-top span{ font-weight:800; letter-spacing:.04em; font-size:14px; }
.auth-photo-top a{ color:rgba(255,255,255,.85); font-size:13px; font-weight:600; text-decoration:none; }
.auth-photo-top a:hover{ color:#fff; text-decoration:underline; }
.auth-caption h1{ font-family:var(--serif); font-weight:500; font-size:clamp(28px,3.2vw,42px); line-height:1.12; max-width:480px; }
.auth-caption p{ color:rgba(251,249,245,.86); margin-top:12px; font-size:15px; max-width:440px; }
.auth-bullets{ list-style:none; margin-top:18px; display:grid; gap:8px; font-size:14px; color:rgba(251,249,245,.9); }
.auth-bullets li{ display:flex; align-items:center; gap:9px; }
.auth-bullets li::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--orange); flex:none; }
.auth-photo-foot{ font-size:12px; color:rgba(251,249,245,.62); }
.auth-panel{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:clamp(24px,4vw,48px) clamp(20px,4vw,48px); background:var(--cw-crema); }
.login-box{ width:100%; max-width:420px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:clamp(26px,4vw,38px); box-shadow:var(--shadow); }
.login-logo{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px; }
.login-logo img{ height:40px; width:auto; }
.login-logo b{ font-size:14px; font-weight:800; letter-spacing:.04em; color:var(--navy); }
.login-box h2{ font-family:var(--serif); font-size:clamp(24px,2.5vw,29px); font-weight:600; color:var(--navy); margin-bottom:6px; text-align:center; }
.login-box .muted{ font-size:14px; text-align:center; }
.login-box form{ display:grid; gap:16px; margin-top:22px; }
.input-ico-wrap{ position:relative; display:flex; align-items:center; }
.input-ico-wrap > svg{ position:absolute; left:13px; color:var(--muted); pointer-events:none; }
.input-ico-wrap input{ padding-left:40px; padding-right:40px; }
.eye-btn{ position:absolute; right:8px; border:0; background:transparent; color:var(--muted); width:32px; height:32px; border-radius:8px; display:grid; place-items:center; }
.eye-btn:hover{ color:var(--navy); background:var(--surface-2); }
.login-switch{ margin-top:20px; padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
.auth-mobile-back{ display:none; }
.btn-pair{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn-pair .btn{ width:100%; }
.login-switch a{ color:var(--orange); font-weight:700; text-decoration:none; }
.login-switch a:hover{ text-decoration:underline; }

/* shared UI */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-sm); }
.btn{ border:0; border-radius:10px; padding:10px 18px; min-height:42px; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .16s, background .2s, box-shadow .2s, border-color .2s; white-space:nowrap; }
.btn-primary{ background:var(--orange); color:#fff; box-shadow:0 4px 12px rgba(217,106,43,.22); }
.btn-primary:hover:not(:disabled){ background:var(--cw-naranja-osc); transform:translateY(-1px); }
.btn-ghost{ background:#fff; border:1px solid var(--line); color:var(--navy); text-decoration:none; }
.btn-ghost:hover:not(:disabled){ background:var(--surface-2); border-color:rgba(17,27,46,.24); }
.btn-danger{ background:transparent; color:#C2412D; padding:8px 12px; min-height:36px; border-radius:8px; }
.btn-danger:hover{ background:#FCE8E5; }
.btn:disabled{ opacity:.48; cursor:not-allowed; }
label{ font-size:12px; font-weight:700; color:var(--muted); display:block; margin-bottom:6px; letter-spacing:.01em; }
input,select,textarea{ width:100%; min-height:42px; padding:10px 13px; border-radius:10px; border:1px solid rgba(17,27,46,.16); background:#fff; font-size:14px; transition:border-color .2s, box-shadow .2s; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(217,106,43,.12); }
input:disabled,select:disabled{ background:var(--surface-2); color:var(--muted); }
textarea{ min-height:110px; resize:vertical; }
.muted{ color:var(--muted); }
.notice{ padding:14px 16px; border-radius:12px; background:var(--orange-soft); border:1px solid #F4CDB4; font-size:13.5px; }
.empty{ text-align:center; padding:clamp(36px,6vw,64px) 24px; max-width:560px; margin:24px auto; }
.empty h2{ font-family:var(--serif); font-size:24px; margin-bottom:8px; color:var(--navy); }
.pill{ display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--navy); white-space:nowrap; }
.pill.ok{ background:var(--green-soft); border-color:rgba(35,122,75,.22); color:var(--green); }
.pill.accent{ background:var(--orange-soft); border-color:rgba(217,106,43,.25); color:var(--cw-naranja-osc); }

/* ===== Editor, Admin & Client Pages ===== */
.sec{ padding:clamp(18px,2.4vw,24px); margin-bottom:18px; }
.sec h3{ font-size:15.5px; font-weight:800; margin-bottom:4px; color:var(--navy); }
.sec .hint{ font-size:13px; color:var(--muted); margin-bottom:16px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
.page-head{ display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:18px; }
.page-kicker{ font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--orange); margin-bottom:3px; }
.page-head h1{ font-family:var(--serif); font-size:clamp(22px,2.4vw,28px); font-weight:600; line-height:1.18; color:var(--navy); }
.row-list{ display:grid; gap:8px; margin-bottom:14px; }
.row{ display:grid; grid-template-columns:115px 100px 1fr auto; gap:10px; align-items:center; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2); font-size:13.5px; }
.row.doc{ grid-template-columns:1fr auto; }
.prop-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap:14px; }
.prop-card{ text-align:left; padding:18px; border:1px solid var(--line); border-radius:16px; background:#fff; transition:border-color .16s, transform .16s, box-shadow .16s; display:grid; gap:8px; }
.prop-card:hover{ border-color:var(--orange); transform:translateY(-2px); box-shadow:var(--shadow); }
.prop-card[aria-current="true"]{ border-color:var(--orange); background:linear-gradient(180deg,#FFF8F3 0%,#FFFFFF 100%); box-shadow:0 0 0 2px rgba(217,106,43,.15); }
.prop-card b{ font-size:15.5px; color:var(--navy); line-height:1.25; }
.prop-card .prop-meta{ font-size:13px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:8px; }
.admin-kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
.admin-kpis.cols-4{ grid-template-columns:repeat(4,1fr); }
.admin-kpi{ padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.admin-kpi b{ font-family:var(--serif); font-size:28px; color:var(--navy); line-height:1; }
.admin-kpi > div span{ font-size:13px; color:var(--muted); font-weight:600; display:block; margin-top:4px; }
.admin-row{ display:grid; grid-template-columns:1fr auto auto auto; gap:10px; align-items:center; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2); font-size:13.5px; }
.admin-prop-row{ display:grid; grid-template-columns:1.35fr 1.1fr auto auto; gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2); font-size:13.5px; }
.admin-inline-form{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.admin-toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; }
.admin-toolbar input[type="search"], .admin-toolbar input[type="text"]{ flex:1 1 220px; min-height:38px; font-size:13.5px; }
.admin-toolbar select{ width:auto; min-width:148px; min-height:38px; font-size:13.5px; }
.admin-toolbar-meta{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; font-size:13px; color:var(--muted); }
.admin-avatar{ width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:800; font-size:12px; flex:none; letter-spacing:.03em; }
.admin-role-box{ padding:12px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-size:13px; color:var(--muted); line-height:1.45; }
.admin-role-box b{ color:var(--navy); display:block; margin-bottom:4px; }
.pill.warn{ background:#FFF4EC; color:#B54F17; border-color:#F3D1BA; }
.add-row{ display:grid; grid-template-columns:150px 96px 1fr auto; gap:10px; align-items:end; }
.add-row.doc{ grid-template-columns:1fr 1fr auto; }
.save-bar{ display:flex; align-items:center; gap:12px; justify-content:flex-end; flex-wrap:wrap; padding:14px 20px !important; background:#fff; border:1px solid rgba(17,27,46,.14); box-shadow:0 6px 20px rgba(17,27,46,.06); }
.status{ font-size:13px; color:var(--muted); font-weight:600; }

/* stepper */
.stepper{ display:flex; align-items:flex-start; overflow-x:auto; padding:8px 4px 4px; scrollbar-width:thin; scroll-snap-type:x proximity; }
.step{ flex:1; min-width:90px; display:flex; flex-direction:column; align-items:center; position:relative; text-align:center; background:none; border:0; padding:0 4px; scroll-snap-align:start; }
.step::before{ content:""; position:absolute; top:16px; left:-50%; width:100%; height:2px; background:var(--line); z-index:0; }
.step:first-child::before{ display:none; }
.step.done::before,.step.now::before{ background:var(--green); }
.dot{ width:34px; height:34px; border-radius:50%; border:2px solid rgba(17,27,46,.16); background:var(--surface); display:grid; place-items:center; font-weight:800; font-size:12.5px; z-index:1; position:relative; color:var(--muted); transition:all .2s; }
.step.done .dot{ background:var(--green); border-color:var(--green); color:#fff; }
.step.now .dot{ border-color:var(--orange); background:var(--orange); color:#fff; box-shadow:0 0 0 5px var(--orange-soft); }
.step b{ font-size:12px; margin-top:8px; color:var(--muted); font-weight:600; line-height:1.25; }
.step.now b{ color:var(--orange); font-weight:800; }
.step.done b{ color:var(--navy); }
button.step:hover .dot{ border-color:var(--orange); }

/* Client summary */
.hello{ position:relative; overflow:hidden; background:radial-gradient(900px 320px at 95% -10%, rgba(217,106,43,.22), transparent 60%), linear-gradient(135deg, var(--cw-azul) 0%, #1C2B47 100%); color:#fff; border:0; padding:clamp(22px,3.2vw,32px); display:flex; gap:20px; justify-content:space-between; align-items:center; flex-wrap:wrap; box-shadow:var(--shadow); margin-bottom:18px; }
.hello-kicker{ font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--cw-naranja-sua); margin-bottom:6px; }
.hello h1{ font-family:var(--serif); font-weight:500; font-size:clamp(24px,3vw,34px); line-height:1.15; }
.hello p{ color:rgba(251,249,245,.78); margin-top:6px; font-size:14.5px; }
.prop-badge{ display:flex; gap:12px; align-items:center; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:12px 16px; backdrop-filter:blur(8px); }
.prop-badge .ico{ width:42px; height:42px; border-radius:11px; background:var(--orange); display:grid; place-items:center; flex:none; }
.prop-badge b{ display:block; font-size:14.5px; color:#fff; line-height:1.25; }
.prop-badge span{ font-size:12.5px; color:rgba(251,249,245,.75); }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
.stats-2{ grid-template-columns:repeat(2,1fr); }
.stats-4{ grid-template-columns:repeat(4,1fr); }
.stat{ padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.stat .n{ font-family:var(--serif); font-size:clamp(26px,2.8vw,32px); font-weight:600; line-height:1; color:var(--navy); }
.stat .l{ color:var(--muted); font-size:13px; font-weight:600; margin-top:6px; }
.stat-ico{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:none; }
.stat-ico.orange{ background:var(--orange-soft); color:var(--orange); }
.stat-ico.navy{ background:#EEF1F6; color:var(--navy); }
.stat-ico.green{ background:var(--green-soft); color:var(--green); }
.progress-pill{ display:inline-flex; align-items:center; gap:8px; margin-top:12px; font-size:12.5px; font-weight:700; color:rgba(251,249,245,.9); }
.progress-track{ width:140px; height:6px; border-radius:999px; background:rgba(255,255,255,.18); overflow:hidden; }
.progress-fill{ height:100%; background:var(--orange); border-radius:999px; }
.stage-desc{ margin-top:16px; padding:12px 16px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-size:13.5px; color:var(--navy); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.client-split{ display:grid; grid-template-columns:1.55fr 1fr; gap:18px; align-items:start; }
.advisor-card{ display:grid; gap:14px; }
.advisor-head{ display:flex; align-items:center; gap:12px; }
.advisor-ava{ width:46px; height:46px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:800; font-size:14px; flex:none; }
.advisor-actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.toolbar-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.toolbar-row input{ max-width:360px; }
.visit{ display:grid; grid-template-columns:44px 130px auto 1fr auto; gap:12px; padding:14px 0; border-top:1px solid var(--line); font-size:14px; align-items:center; }
.visit:first-of-type{ border-top:0; padding-top:4px; }
.visit-num{ width:34px; height:34px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); display:grid; place-items:center; font-weight:800; font-size:12.5px; color:var(--navy); }
.visit-date{ font-weight:700; color:var(--navy); font-size:13.5px; }
.doc-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap:14px; }
.doc-card{ padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--surface-2); display:grid; gap:12px; transition:border-color .18s, background .18s, transform .18s; }
.doc-card:hover{ border-color:var(--orange); background:#fff; transform:translateY(-2px); box-shadow:var(--shadow-sm); }
.doc-card-top{ display:flex; align-items:flex-start; gap:12px; }
.doc-card-ico{ width:40px; height:40px; border-radius:10px; background:var(--orange-soft); color:var(--orange); display:grid; place-items:center; flex:none; }
.doc-card b{ display:block; font-size:14.5px; color:var(--navy); line-height:1.3; }
.doc-card small{ display:block; font-size:12px; color:var(--muted); margin-top:2px; }
.summary{ background:linear-gradient(180deg, #FFFDF9 0%, var(--cw-crema-2) 100%); border:1px solid rgba(17,27,46,.1); border-left:4px solid var(--orange); }
.summary .date{ font-size:12px; color:var(--muted); font-weight:700; }
.summary p{ white-space:pre-wrap; font-size:14.5px; line-height:1.65; color:var(--navy); }
.doc-link{ display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); text-decoration:none; color:var(--navy); margin-bottom:10px; font-weight:600; font-size:14px; transition:border-color .2s, background .2s, transform .15s; }
.doc-link:last-child{ margin-bottom:0; }
.doc-link:hover{ border-color:var(--orange); background:#fff; transform:translateX(2px); }
.doc-link-l{ display:flex; align-items:center; gap:10px; min-width:0; }
.doc-link-l span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wsp-btn{ background:#1F9D55; color:#fff; text-decoration:none; width:100%; }
.wsp-btn:hover{ background:#198548; transform:translateY(-1px); }
.footer{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:28px; }
.inbox-grid{ display:grid; grid-template-columns:320px 1fr; gap:18px; align-items:start; }
.inbox-list{ padding:14px; display:grid; gap:8px; }
.inbox-item{ width:100%; text-align:left; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); display:grid; gap:4px; transition:border-color .15s, background .15s; }
.inbox-item:hover{ border-color:var(--orange); background:#fff; }
.inbox-item[aria-current="true"]{ border-color:var(--orange); background:var(--orange-soft); }
.inbox-item b{ font-size:14px; color:var(--navy); line-height:1.25; }
.inbox-item small{ font-size:12px; color:var(--muted); }
.inbox-thread{ display:flex; flex-direction:column; min-height:520px; max-height:70vh; overflow:hidden; }
.inbox-head{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:#fff; }
.inbox-msgs{ flex:1; overflow-y:auto; padding:18px 20px; background:var(--cw-crema); display:flex; flex-direction:column; gap:10px; }
.inbox-compose{ padding:14px 18px; border-top:1px solid var(--line); background:#fff; display:flex; gap:10px; align-items:center; }
.inbox-compose input{ flex:1; }
.checklist{ display:grid; gap:10px; }
.check-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); font-size:13px; color:var(--navy); }
.prop-mini-bar{ height:5px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:4px; }
.prop-mini-bar span{ display:block; height:100%; background:var(--orange); border-radius:999px; }
.prop-card-stats{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.prop-card-stats span{ font-size:12px; font-weight:600; color:var(--muted); background:var(--surface-2); padding:3px 9px; border-radius:8px; border:1px solid var(--line); }
.link-steps{ display:grid; gap:10px; margin-top:14px; }
.link-step{ display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-size:13.5px; }
.link-step-num{ width:26px; height:26px; border-radius:50%; background:var(--orange-soft); color:var(--orange); font-weight:800; font-size:12px; display:grid; place-items:center; flex:none; }
@media (max-width:1100px){ .stats-4{ grid-template-columns:repeat(2,1fr); } .client-split,.inbox-grid{ grid-template-columns:1fr; } .inbox-thread{ max-height:none; min-height:420px; } }

/* ===== Floating Chat Bubble + Popover (estilo Messenger / Venty) ===== */
.chat-widget{ position:fixed; right:clamp(14px,2.5vw,26px); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:55; }
.chat-fab{ width:60px; height:60px; border-radius:50%; border:0; background:linear-gradient(135deg, var(--cw-azul) 0%, #1F3254 100%); color:#fff; box-shadow:0 12px 28px rgba(17,27,46,.28); display:grid; place-items:center; position:relative; transition:transform .2s, box-shadow .2s; }
.chat-fab:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 16px 34px rgba(17,27,46,.34); }
.chat-fab-dot{ position:absolute; top:3px; right:3px; width:14px; height:14px; border-radius:50%; background:#22C55E; border:2.5px solid #fff; }
.chat-fab-count{ position:absolute; top:-4px; left:-4px; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:var(--orange); color:#fff; font-size:11px; font-weight:800; display:grid; place-items:center; border:2px solid #fff; }
.chat-popover{ display:none; position:absolute; right:0; bottom:0; width:min(380px, calc(100vw - 24px)); height:min(520px, calc(100vh - 90px)); background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:0 24px 60px rgba(17,27,46,.24); overflow:hidden; flex-direction:column; }
.chat-widget.open .chat-fab{ display:none; }
.chat-widget.open .chat-popover{ display:flex; }
.chat-pop-head{ background:linear-gradient(135deg, var(--cw-azul) 0%, #1D2D4B 100%); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; }
.chat-pop-ava{ width:38px; height:38px; border-radius:50%; background:var(--orange); color:#fff; display:grid; place-items:center; font-weight:800; font-size:13px; flex:none; position:relative; }
.chat-pop-ava::after{ content:""; position:absolute; right:0; bottom:0; width:10px; height:10px; border-radius:50%; background:#22C55E; border:2px solid var(--cw-azul); }
.chat-pop-info{ flex:1; min-width:0; }
.chat-pop-info b{ display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-pop-info small{ display:block; font-size:11.5px; color:rgba(251,249,245,.75); }
.chat-pop-actions{ display:flex; align-items:center; gap:6px; }
.chat-pop-icon{ width:32px; height:32px; border-radius:8px; border:0; background:rgba(255,255,255,.12); color:#fff; display:grid; place-items:center; text-decoration:none; font-size:16px; }
.chat-pop-icon:hover{ background:rgba(255,255,255,.22); }
.chat-pop-body{ flex:1; overflow-y:auto; padding:14px; background:var(--cw-crema); display:flex; flex-direction:column; gap:10px; }
.msg{ max-width:85%; padding:10px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; }
.msg small{ display:block; font-size:11px; color:var(--muted); margin-top:4px; }
.msg.asesor{ background:#fff; border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
.msg.propietario{ background:var(--orange-soft); border:1px solid #F4CDB4; align-self:flex-end; border-bottom-right-radius:4px; }
.msg b{ font-size:11.5px; display:block; margin-bottom:2px; color:var(--navy); }
.chat-pop-foot{ padding:12px; background:#fff; border-top:1px solid var(--line); display:flex; gap:8px; }
.chat-pop-foot input{ flex:1; min-height:40px; padding:8px 12px; }
.chat-pop-foot .btn{ min-height:40px; padding:8px 14px; }

.row,.admin-row,.admin-prop-row,.doc-card,.prop-card,.check-item,.visit{ min-width:0; overflow-wrap:anywhere; }

/* ===== Custom Confirm Modal ===== */
.cw-modal-backdrop{ position:fixed; inset:0; background:rgba(17,27,46,.52); backdrop-filter:blur(4px); z-index:90; display:none; place-items:center; padding:18px; }
.cw-modal-backdrop.open{ display:grid; }
.cw-modal{ width:min(440px, 100%); background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:0 24px 60px rgba(17,27,46,.26); padding:24px; display:grid; gap:14px; animation:cwPop .16s ease-out; }
@keyframes cwPop{ from{ opacity:0; transform:scale(.96) translateY(6px); } to{ opacity:1; transform:scale(1) translateY(0); } }
.cw-modal-head{ display:flex; align-items:flex-start; gap:14px; }
.cw-modal-ico{ width:44px; height:44px; border-radius:12px; background:#FEEAEA; color:#C2412D; display:grid; place-items:center; flex:none; }
.cw-modal-head h3{ font-family:var(--serif); font-size:20px; font-weight:600; color:var(--navy); line-height:1.2; margin-bottom:4px; }
.cw-modal-head p{ font-size:13.5px; color:var(--muted); line-height:1.5; }
.cw-modal-warn{ padding:12px 14px; border-radius:12px; background:#FFF4EE; border:1px solid #F5CBB2; color:#9A3E12; font-size:13.5px; line-height:1.45; font-weight:600; }
.cw-modal-actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
.btn-danger-solid{ background:#C2412D; color:#fff; }
.btn-danger-solid:hover{ background:#A63523; transform:translateY(-1px); }

/* ===== Tablet & Mobile Responsive ===== */
@media (max-width:960px){
  .main-area,.wrap,.card{ min-width:0; max-width:100%; }
  .sidebar{ position:fixed; left:0; top:env(safe-area-inset-top,0px); bottom:0; height:auto; width:min(288px, 85vw); transform:translateX(-100%); box-shadow:var(--shadow-lg); }
  .sidebar.open{ transform:translateX(0); }
  body.sb-collapsed .sidebar{ width:min(288px, 85vw); }
  body.sb-collapsed .sb-brand-txt,body.sb-collapsed .sb-group,body.sb-collapsed .sb-prop-picker,body.sb-collapsed .sb-link span,body.sb-collapsed .sb-btn-lbl{ display:block; }
  body.sb-collapsed .sb-link{ justify-content:flex-start; padding:10px 12px; }
  body.sb-collapsed .sb-brand{ justify-content:flex-start; padding:18px 16px; }
  .sb-collapse-btn{ display:none; }
  .sb-close{ display:grid; place-items:center; }
  .menu-toggle{ display:grid; }
  .admin-kpis, .admin-kpis.cols-4{ grid-template-columns:repeat(2,1fr); }
  .admin-kpis > .admin-kpi:last-child:nth-child(odd){ grid-column:1 / -1; }
  .stats{ grid-template-columns:repeat(2,1fr); }
  .stats:not(.stats-2):not(.stats-4) > .stat:last-child:nth-child(odd){ grid-column:1 / -1; }
  .grid3{ grid-template-columns:1fr 1fr; }
}
@media (max-width:860px){
  .auth-split{ grid-template-columns:1fr; min-height:100dvh; background:linear-gradient(180deg, rgba(17,27,46,.70) 0%, rgba(17,27,46,.86) 100%), url("assets/entrega-llaves.jpg") center/cover no-repeat; }
  .auth-photo{ display:none; }
  .auth-panel{ background:transparent; min-height:100dvh; justify-content:center; padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px)); gap:16px; }
  .auth-mobile-back{ display:inline-flex; align-items:center; gap:6px; color:rgba(255,255,255,.94); font-size:13.5px; font-weight:700; text-decoration:none; padding:9px 18px; border-radius:999px; background:rgba(17,27,46,.58); border:1px solid rgba(255,255,255,.24); backdrop-filter:blur(6px); }
}
@media (max-width:640px){
  .topbar-app{ padding:0 14px; gap:10px; }
  .wrap{ padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px)); }
  .grid2,.grid3,.add-row,.add-row.doc{ grid-template-columns:1fr; }
  .row,.admin-row,.admin-prop-row{ grid-template-columns:1fr; gap:8px; align-items:start; }
  .admin-row{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; }
  .admin-row > span:first-child{ flex:1 1 100%; }
  .admin-inline-form{ flex-direction:column; }
  .stats,.stats-2,.stats-4,.admin-kpis,.admin-kpis.cols-4{ grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat,.admin-kpi{ padding:14px; gap:8px; }
  .stat .n,.admin-kpi b{ font-size:24px; }
  .stat-ico{ width:36px; height:36px; border-radius:10px; }
  .stats:not(.stats-2):not(.stats-4) > .stat:last-child:nth-child(odd),
  .admin-kpis > .admin-kpi:last-child:nth-child(odd){ grid-column:1 / -1; }
  .visit{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:12px 0; }
  .visit-num{ order:1; width:30px; height:30px; font-size:12px; border-radius:8px; }
  .visit-date{ order:2; flex:1 1 auto; white-space:nowrap; font-size:13.5px; }
  .visit > .pill{ order:3; flex:none; }
  .visit > span:not(.visit-date):not(.pill){ order:4; flex:1 0 100%; font-size:13.5px; color:var(--navy); line-height:1.45; }
  .user-meta{ display:none; }
  .user-btn{ padding:3px 8px 3px 3px; }
  .hello{ padding:20px 18px; gap:14px; }
  .hello > div:last-child{ width:100%; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .hello > div:last-child .btn:last-child:nth-child(odd){ grid-column:1 / -1; }
  .prop-badge{ width:100%; }
  .progress-track{ width:100px; }
  .toolbar-row{ flex-direction:column; align-items:stretch; }
  .toolbar-row input,.toolbar-row select{ max-width:none !important; width:100%; }
  .composer{ flex-direction:column; align-items:stretch; }
  .composer .btn{ width:100%; }
  .stepper{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px 6px; overflow-x:visible; padding:6px 0 2px; }
  .step{ min-width:0; }
  .step::before{ display:none; }
  .step b{ font-size:11px; }
  .inbox-thread{ min-height:380px; }
  .inbox-head{ padding:14px 16px; }
  .inbox-msgs{ padding:14px 14px; }
  .inbox-compose{ padding:12px; gap:8px; }
  .chat-widget.open{ inset:0; right:0; bottom:0; width:100vw; height:100dvh; z-index:85; }
  .chat-popover{ position:fixed; inset:0; width:100vw; height:100dvh; max-width:none; max-height:none; border-radius:0; border:0; }
  .chat-pop-head{ padding-top:calc(14px + env(safe-area-inset-top,0px)); }
  .chat-pop-foot{ padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); }
  .save-bar{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 14px !important; }
  .save-bar .status{ grid-column:1 / -1; margin-right:0; }
  .save-bar .btn{ width:100%; }
}
@media (max-width:480px){
  .auth-card{ padding:22px 18px; border-radius:16px; }
  .page-head{ gap:10px; }
  .cw-modal{ padding:20px 18px; }
}
@media (max-width:360px){
  .stats,.stats-2,.stats-4,.admin-kpis,.advisor-actions,.save-bar,.hello > div:last-child,.cw-modal-actions,.btn-pair{ grid-template-columns:1fr; }
}
</style>

<body>
<div class="shell">
  <div class="sb-backdrop" id="sb-backdrop"></div>
  <aside class="sidebar" id="sidebar" aria-label="Menú principal">
    <div class="sb-brand">
      <img src="assets/logo-cw-transparente-512.png" alt="CW Inmobiliaria">
      <div class="sb-brand-txt">
        <b>CW INMOBILIARIA</b>
        <small id="brand-sub">Portal</small>
      </div>
      <button type="button" class="sb-collapse-btn" id="sb-collapse" title="Comprimir o expandir menú" aria-label="Comprimir menú">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button type="button" class="sb-close" id="sb-close" aria-label="Cerrar menú">✕</button>
    </div>
    <div class="sb-prop-picker" id="sb-prop-picker" style="display:none"></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot" id="sb-foot"></div>
  </aside>

  <div class="main-area">
    <header class="topbar-app">
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="page-head-title">
        <h2 id="page-title">Portal CW</h2>
        <span id="page-sub">CW Inmobiliaria</span>
      </div>
      <div class="user-menu" id="user-menu" style="display:none">
        <button type="button" class="user-btn" id="user-btn" aria-expanded="false" aria-haspopup="true">
          <span class="avatar" id="user-avatar">CW</span>
          <span class="user-meta">
            <b id="user-name">Usuario</b>
            <small id="user-role">Portal CW</small>
          </span>
          <svg class="user-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="user-drop" id="user-drop" role="menu">
          <div class="user-drop-head">
            <b id="drop-name">Usuario</b>
            <span id="drop-role">CW Inmobiliaria</span>

<script>
(() => {
  // Si la página se abrió desde el enlace de un propietario, se muestra solo su vista.
  const OWNER_ENTRY = location.hash.indexOf("#propietario-") === 0;
  const STAGES = ["Evaluación","Preparación","Publicación","Visitas","Negociación","Cierre"];
  const STAGE_INFO = [
    "Estamos realizando el análisis comparativo de mercado y definiendo el precio óptimo de salida.",
    "Preparamos la documentación legal, sesión fotográfica y material comercial de tu inmueble.",
    "Tu propiedad ya está publicada y promocionada en portales aliados y redes sociales de CW.",
    "Coordinamos y filtramos interesados calificados para realizar visitas presenciales.",
    "Evaluamos ofertas formales, condiciones de pago y términos de cierre contigo.",
    "Firma de minuta/escritura pública en notaría y entrega final de la propiedad."
  ];
  const app = document.getElementById("app");
  const state = { db:null, sb:null, mode:null, user:null, role:null, canWrite:null, isAdmin:null, isSuperAdmin:false, asesores:[], vitrina:[], vitrinaError:"", vitrinaDraft:null, props:[], loaded:false, error:null, errorDetail:"", selected:null, view:"asesor", page:null, chatOpen:false, clientId:null, messages:[], msgUnsub:null, msgPoll:null, msgFor:null, draft:null, dirty:false, saving:false, status:"", authChecked:false, editingAccessId:null, lastCreatedUser:null, adminFilters:{ accQ:"", accStatus:"all", accStage:"all", accSort:"name", teamQ:"", teamRol:"all", vitQ:"", vitVis:"all", vitTag:"all", vitDist:"all", crearOnlyPending:false } };

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtDate = (d) => { if(!d) return ""; const t = new Date(d + (d.length===10 ? "T12:00:00" : "")); return isNaN(t) ? d : t.toLocaleDateString("es-PE",{day:"2-digit",month:"short",year:"numeric"}); };
  const fmtDT = (iso) => { const t = new Date(iso); return isNaN(t) ? "" : t.toLocaleString("es-PE",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); };
  const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
  const newId = (p) => {
    const raw = (window.crypto && window.crypto.randomUUID)
      ? window.crypto.randomUUID().replace(/-/g, "")
      : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    return p + raw;
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // ---------- routing & shell controls ----------
  function readHash(){
    const h = location.hash.replace("#","");
    if (h.startsWith("propietario-")) { state.view = "cliente"; state.clientId = h.slice(12); }
    else if (h === "asesor") { state.view = "asesor"; }
    else if (h === "admin") { state.view = "admin"; }
    else { state.view = "cliente"; }
  }
  function go(view, id){
    if (view === "cliente" && id) location.hash = "propietario-" + id;
    else location.hash = view;
  }
  window.addEventListener("hashchange", () => {
    const before = state.clientId; readHash();
    if (state.db && !state.isAdmin && state.clientId !== before) startData(); else render();
  });

  const sidebarEl = document.getElementById("sidebar");
  const sbBackdropEl = document.getElementById("sb-backdrop");
  const closeDrawer = () => {
    if (sidebarEl) sidebarEl.classList.remove("open");
    if (sbBackdropEl) sbBackdropEl.classList.remove("open");
  };
  const openDrawer = () => {
    if (sidebarEl) sidebarEl.classList.add("open");
    if (sbBackdropEl) sbBackdropEl.classList.add("open");
  };
  const menuToggleEl = document.getElementById("menu-toggle");
  const sbCloseEl = document.getElementById("sb-close");
  const sbCollapseEl = document.getElementById("sb-collapse");
  if (localStorage.getItem("cw_sb_collapsed") === "1") document.body.classList.add("sb-collapsed");
  if (sbCollapseEl) {
    sbCollapseEl.onclick = () => {
      const collapsed = document.body.classList.toggle("sb-collapsed");
      localStorage.setItem("cw_sb_collapsed", collapsed ? "1" : "0");
    };
  }
  if (menuToggleEl) menuToggleEl.onclick = openDrawer;
  if (sbCloseEl) sbCloseEl.onclick = closeDrawer;
  if (sbBackdropEl) sbBackdropEl.onclick = closeDrawer;

  const chatWidgetEl = document.getElementById("chat-widget");
  const chatFabEl = document.getElementById("chat-fab");
  const chatCloseEl = document.getElementById("chat-close");
  function getChatSeen(propId){
    if (!propId) return "";
    try { return localStorage.getItem("cw_chat_seen_" + propId) || ""; } catch(e){ return ""; }
  }
  function markChatSeen(propId){
    if (!propId) return;
    const last = state.messages.length ? state.messages[state.messages.length - 1].fecha : "";
    const ts = last || new Date().toISOString();
    try { localStorage.setItem("cw_chat_seen_" + propId, ts); } catch(e){}
  }

  function setChatOpen(open){
    state.chatOpen = !!open;
    if (chatWidgetEl) chatWidgetEl.classList.toggle("open", state.chatOpen);
    if (chatFabEl) chatWidgetEl.setAttribute("aria-expanded", String(state.chatOpen));
    if (state.chatOpen) {
      markChatSeen(state.msgFor);
      if (state.msgFor) refreshMessagesNow(state.msgFor);
      const countEl = document.getElementById("chat-count");
      if (countEl) countEl.style.display = "none";
      const box = document.getElementById("chat");
      if (box) box.scrollTop = box.scrollHeight;
      const inp = document.getElementById("msg-in");
      if (inp && !inp.disabled) setTimeout(() => inp.focus(), 60);
    } else {
      renderChatOnly();
    }
  }
  if (chatFabEl) chatFabEl.onclick = () => setChatOpen(!state.chatOpen);
  if (chatCloseEl) chatCloseEl.onclick = () => setChatOpen(false);

  // ---------- data ----------
  // Dos backends con la misma interfaz:
  //  - Supabase (producción): asesor y propietarios ven los mismos datos desde cualquier equipo.
  //  - localStorage (demo): se activa con ?demo=1 y guarda solo en este navegador.
  function makeLocalDb(){
    const KEY = "cw_portal_db";
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ return {}; } };
    const save = (s) => localStorage.setItem(KEY, JSON.stringify(s));
    const subs = new Set(); const emit = () => subs.forEach(f => f());
    window.addEventListener("storage", e => { if (e.key === KEY) emit(); });
    const snap = (path, data) => ({ id:path.split("/").pop(), exists:!!data, data:() => data });
    function collection(path){
      let order = null, lim = null;
      const q = {
        orderBy(f){ order = f; return q; }, limit(n){ lim = n; return q; },
        onSnapshot(next){
          const run = () => { const s = load(), depth = path.split("/").length + 1;
            let docs = Object.keys(s).filter(k => k.startsWith(path + "/") && k.split("/").length === depth).map(k => snap(k, s[k]));
            if (order) docs.sort((a,b) => String(a.data()[order]).localeCompare(String(b.data()[order])));
            if (lim) docs = docs.slice(0, lim);
            next({ docs }); };
          subs.add(run); setTimeout(run, 0); return () => subs.delete(run);
        }
      };
      return q;
    }
    function doc(path){
      return {
        set: async (d) => { const s = load(); s[path] = JSON.parse(JSON.stringify(d)); save(s); emit(); },
        delete: async () => { const s = load(); delete s[path]; save(s); emit(); },
        onSnapshot(next){ const run = () => next(snap(path, load()[path])); subs.add(run); setTimeout(run, 0); return () => subs.delete(run); }
      };
    }
    return { collection, doc };
  }
  function makeSupabaseDb(sb){
    const toProp = (row) => row && ({
      id: row.id,
      propietario: row.propietario || "",
      propietarioEmail: row.propietario_email || "",
      asesorWhatsapp: row.asesor_whatsapp || "",
      propiedad: row.propiedad || "",
      direccion: row.direccion || "",
      etapa: row.etapa || 0,
      interesados: row.interesados || 0,
      propuestas: row.propuestas || 0,
      resumen: row.resumen || "",
      resumenFecha: row.resumen_fecha || "",
      visitas: Array.isArray(row.visitas) ? row.visitas : [],
      documentos: Array.isArray(row.documentos) ? row.documentos : [],
      actualizado: row.actualizado || row.creado_en || ""
    });
    const fromProp = (d) => ({
      propietario: d.propietario || "",
      propietario_email: (d.propietarioEmail || "").trim().toLowerCase(),
      asesor_whatsapp: (d.asesorWhatsapp || "").trim(),
      propiedad: d.propiedad || "",
      direccion: d.direccion || "",
      etapa: Math.max(0, Math.min(5, parseInt(d.etapa, 10) || 0)),
      interesados: Math.max(0, parseInt(d.interesados, 10) || 0),
      propuestas: Math.max(0, parseInt(d.propuestas, 10) || 0),
      resumen: d.resumen || "",
      resumen_fecha: d.resumenFecha || null,
      visitas: Array.isArray(d.visitas) ? d.visitas : [],
      documentos: Array.isArray(d.documentos) ? d.documentos : [],
      actualizado: d.actualizado || new Date().toISOString()
    });

    // Refresca la vista cada vez que cambia la tabla. Es más simple y robusto
    // que intentar aplicar los cambios fila por fila.
    function subscribeTable(table, onChange){
      const channel = sb.channel("cw-" + table + "-" + Math.random().toString(36).slice(2))
        .on("postgres_changes", { event:"*", schema:"public", table }, onChange)
        .subscribe();
      return () => { sb.removeChannel(channel); };
    }

    function collection(path){
      const isMensajes = path.indexOf("mensajes/") === 0;
      const propId = isMensajes ? path.split("/")[1] : null;
      const table = isMensajes ? "mensajes" : "propiedades";
      let order = null, lim = null;
      const api = {
        orderBy(f){ order = f; return api; },
        limit(n){ lim = n; return api; },
        onSnapshot(next, err){
          let active = true;
          const fetchRows = async () => {
            try {
              let q = sb.from(table).select("*");
              if (isMensajes) q = q.eq("propiedad_id", propId);
              if (order) q = q.order(order === "resumenFecha" ? "resumen_fecha" : order, { ascending: true });
              if (lim) q = q.limit(lim);
              const { data, error } = await q;
              if (!active) return;
              if (error) { if (err) err(error); return; }
              const docs = (data || []).map(row => {
                const mapped = isMensajes
                  ? { de: row.de, texto: row.texto, fecha: row.fecha }
                  : toProp(row);
                return { id: row.id, exists: true, data: () => mapped };
              });
              next({ docs });
            } catch (e) {
              if (active && err) err(e);
            }
          };
          fetchRows();
          const unsub = subscribeTable(table, fetchRows);
          return () => { active = false; unsub(); };
        }
      };
      return api;
    }

    function doc(path){
      const parts = path.split("/");
      const isMensajes = parts[0] === "mensajes";
      const propId = isMensajes ? parts[1] : null;
      const id = parts[parts.length - 1];
      const table = isMensajes ? "mensajes" : "propiedades";
      return {
        async set(d){
          if (isMensajes) {
            const { error } = await sb.from("mensajes").insert({
              id,
              propiedad_id: propId,
              de: d.de,
              texto: String(d.texto || "").slice(0, 1000),
              fecha: d.fecha || new Date().toISOString()
            });
            if (error) throw error;
          } else {
            const { error } = await sb.from("propiedades").upsert({ id, ...fromProp(d) });
            if (error) throw error;
          }
        },
        async delete(){
          const { data, error } = await sb.from(table).delete().eq("id", id).select("id");
          if (error) throw error;
          if (!data || !data.length) throw new Error("No tienes permiso para eliminar este registro o ya no existe.");
        },
        onSnapshot(next, err){
          let active = true;
          const fetchRow = async () => {
            const { data, error } = await sb.from(table).select("*").eq("id", id).maybeSingle();
            if (!active) return;
            if (error) { if (err) err(error); return; }
            if (!data) { next({ id, exists: false, data: () => undefined }); return; }
            const mapped = isMensajes
              ? { de: data.de, texto: data.texto, fecha: data.fecha }
              : toProp(data);
            next({ id, exists: true, data: () => mapped });
          };
          fetchRow();
          const unsub = subscribeTable(table, fetchRow);
          return () => { active = false; unsub(); };
        }
      };
    }
    return { collection, doc };
  }

  let propsUnsub = null;
  let lastAuthUid = null;
  function startData(){
    if (propsUnsub) { propsUnsub(); propsUnsub = null; }
    if (!state.user && state.mode === "supabase") {
      if (state.msgUnsub) { state.msgUnsub(); state.msgUnsub = null; }
      if (state.msgPoll) { clearInterval(state.msgPoll); state.msgPoll = null; }
      state.msgFor = null; state.messages = [];
      state.props = []; state.loaded = true; state.error = null; render();
      return;
    }
    if (!state.props.length) { state.loaded = false; state.error = null; render(); }
    const timer = setTimeout(() => { if (!state.loaded) { state.error = "timeout"; state.loaded = true; render(); } }, 10000);
    const fail = (e) => { clearTimeout(timer); state.error = "unavailable"; state.errorDetail = (e && (e.message || e.error_description)) || ""; state.loaded = true; render(); };
    if (state.isAdmin || state.user || state.mode === "local") {
      propsUnsub = state.db.collection("propiedades").onSnapshot(snap => {
        clearTimeout(timer);
        state.props = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (b.actualizado||"").localeCompare(a.actualizado||""));
        state.loaded = true; state.error = null;
        if (!state.selected && state.props.length) state.selected = state.props[0].id;
        if (state.selected && !state.props.find(p => p.id === state.selected)) state.selected = state.props[0] ? state.props[0].id : null;
        if (!state.dirty) state.draft = null;
        render();
      }, fail);
    } else { clearTimeout(timer); state.props = []; state.loaded = true; render(); }
  }

  async function init(){
    readHash();
    const cfg = window.CW_SUPABASE_CONFIG;
    const forceDemo = new URLSearchParams(location.search).get("demo") === "1";
    const useSupabase = !forceDemo && !!(cfg && cfg.url && cfg.anonKey && window.supabase && window.supabase.createClient);
    state.mode = useSupabase ? "supabase" : "local";
    state.canWrite = true;
    if (useSupabase) {
      state.sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
      });
      state.db = makeSupabaseDb(state.sb);
      state.sb.auth.onAuthStateChange((event, session) => {
        const nextUser = session ? session.user : null;
        const sameLoadedUser = !!(nextUser && lastAuthUid === nextUser.id && state.loaded && state.authChecked);
        state.user = nextUser;
        lastAuthUid = nextUser ? nextUser.id : null;
        if (sameLoadedUser && (event === "TOKEN_REFRESHED" || event === "SIGNED_IN")) return;
        setTimeout(async () => {
          if (state.user) {
            try {
              const { data: rolData, error: rolErr } = await state.sb.rpc("mi_rol");
              if (!rolErr && rolData) {
                state.role = rolData;
              } else {
                const { data: isAsesor } = await state.sb.rpc("es_asesor");
                state.role = isAsesor ? "asesor" : "propietario";
              }
            } catch {
              state.role = "propietario";
            }
            state.isSuperAdmin = (state.role === "admin");
            state.isAdmin = (state.role === "admin" || state.role === "asesor");
            if (state.isSuperAdmin) { loadAsesores(); loadVitrina(); }
            if (state.isAdmin && !location.hash.startsWith("#propietario-") && location.hash !== "#admin") {
              state.view = "asesor";
              if (location.hash !== "#asesor") history.replaceState(null, "", "#asesor");
            }
          } else {
            state.role = null;
            state.isSuperAdmin = false;
            state.isAdmin = false;
            state.asesores = [];
          }
          state.authChecked = true;
          startData();
        }, 0);
      });
    } else {
      state.db = makeLocalDb();
      state.user = { email: "demo@cwinmobiliaria.pe" };
      state.role = "admin";
      state.isSuperAdmin = true;
      state.isAdmin = true;
      state.authChecked = true;
      startData();
    }
  }

  async function loadAsesores(){
    if (!state.sb || !state.isSuperAdmin) return;
    const { data, error } = await state.sb.from("asesores").select("*").order("creado_en", { ascending: true });
    if (!error && Array.isArray(data)) {
      state.asesores = data;
      if (state.view === "admin") render();
    }

  function fileToOptimizedDataUrl(file){
    return new Promise((resolve, reject) => {
      if (!file || !file.type || !file.type.startsWith("image/")) { reject(new Error("Archivo no válido")); return; }
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => resolve(reader.result);
        img.onload = () => {
          const maxSide = 1200;
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if (w > maxSide || h > maxSide) {
            if (w >= h) { h = Math.round((h * maxSide) / w); w = maxSide; }
            else { w = Math.round((w * maxSide) / h); h = maxSide; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

    if (!state.db || !propId) return;
    state.msgUnsub = state.db.collection("mensajes/" + propId + "/items").orderBy("fecha").limit(200).onSnapshot(snap => {
      if (state.msgFor !== propId) return;

    }, (err) => { console.warn("Error cargando mensajes:", err); });

      state.msgPoll = setInterval(() => {

      }, 3500);

  function cwConfirm({ title, message, warning, confirmText = "Eliminar" }){
    return new Promise((resolve) => {
      const bd = document.getElementById("cw-modal-backdrop");
      const tEl = document.getElementById("cw-modal-title");
      const dEl = document.getElementById("cw-modal-desc");
      const wEl = document.getElementById("cw-modal-warn");
      const cBtn = document.getElementById("cw-modal-cancel");
      const okBtn = document.getElementById("cw-modal-confirm");
      if (!bd) { resolve(confirm((warning ? warning + "\n\n" : "") + message)); return; }
      tEl.textContent = title || "Confirmar acción";
      dEl.textContent = message || "";
      if (warning) { wEl.textContent = warning; wEl.style.display = ""; }
      else { wEl.textContent = ""; wEl.style.display = "none"; }
      okBtn.textContent = confirmText;
      bd.classList.add("open");
      okBtn.focus();
      const close = (val) => {
        bd.classList.remove("open");
        cBtn.onclick = null; okBtn.onclick = null; bd.onclick = null;
        document.removeEventListener("keydown", onKey);
        resolve(val);
      };
      const onKey = (e) => { if (e.key === "Escape") close(false); };
      document.addEventListener("keydown", onKey);
      cBtn.onclick = () => close(false);
      okBtn.onclick = () => close(true);
      bd.onclick = (e) => { if (e.target === bd) close(false); };
    });
  }

  async function deleteProp(id){
    if (!state.db) return;
    const target = state.props.find(p => p.id === id);
    const propName = (target && target.propiedad) ? target.propiedad.trim() : "Propiedad sin nombre";
    const ownerName = (target && target.propietario) ? target.propietario.trim() : "";
    const ownerEmail = (target && target.propietarioEmail) ? target.propietarioEmail.trim() : "";
    const hasOwner = !!(ownerName || ownerEmail);
    const ownerLabel = ownerName || ownerEmail;
    const ok = await cwConfirm({
      title: 'Eliminar "' + propName + '"',
      warning: hasOwner
        ? '¿Estás seguro? Esta propiedad está a nombre de ' + ownerLabel + (ownerName && ownerEmail ? ' (' + ownerEmail + ')' : '') + '.'
        : '',
      message: hasOwner
        ? 'Si la eliminas, el propietario perderá acceso inmediato a su portal y se borrarán sus visitas, documentos y mensajes asociados.'
        : 'Esta propiedad no tiene propietario asignado. Se eliminará de tu cartera junto con sus registros asociados.',
      confirmText: "Sí, eliminar"
    });
    if (!ok) return;
    try {
      await state.db.doc("propiedades/" + id).delete();
      state.props = state.props.filter(p => p.id !== id);
      if (state.selected === id) { state.selected = state.props[0] ? state.props[0].id : null; state.draft = null; state.dirty = false; }
      if (state.page !== "asesor-lista") state.page = "asesor-lista";
      state.status = "Propiedad eliminada.";
      render();
    } catch(e){ handleWriteError(e); }

  function handleWriteError(e){
    const msg = (e && (e.message || e.error_description)) || "";
    const code = e && (e.code || e.status);
    if (code === "42501" || code === "PGRST301" || /row-level security|permission denied|jwt/i.test(msg)) {
      state.canWrite = false;
      alert("Tu acceso a este portal es de solo lectura. Inicia sesión con el usuario asesor autorizado.");

    } else {
      alert("No se pudo completar la acción. Inténtalo nuevamente.\n" + msg);
    }
  }

      const addImageFiles = async (files) => {
        if (!files || !files.length) return;
        syncDraftFields();
        const added = [];
        for (const f of files) {
          try { added.push(await fileToOptimizedDataUrl(f)); } catch(e){}

        if (added.length) {
          vd.imagenes = (vd.imagenes || []).concat(added);
          render();

        syncDraftFields();
        try {
          if (navigator.clipboard && navigator.clipboard.read) {
